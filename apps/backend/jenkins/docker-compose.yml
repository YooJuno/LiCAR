services:
  jenkins:
    build:
      context: .
    container_name: jenkins
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./jenkins_home:/var/jenkins_home
      # - $HOME/.m2:/var/jenkins_home/.m2
    environment:
      - JENKINS_OPTS=--prefix=/jenkins
    group_add:
      - 0
    networks:
      - drug-network
  
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - jenkins
    networks:
      - drug-network

networks:
  drug-network:
    driver: bridge
    name: drug-network