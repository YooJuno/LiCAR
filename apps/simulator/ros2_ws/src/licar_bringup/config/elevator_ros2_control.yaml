controller_manager:
  ros__parameters:
    update_rate: 100  # 높은 업데이트 주파수로 복원

    lift_joint_position_controller:
      type: position_controllers/JointGroupPositionController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

lift_joint_position_controller:
  ros__parameters:
    joints:
      - lift_joint

joint_state_broadcaster:
  ros__parameters:
    joints:
      - lift_joint